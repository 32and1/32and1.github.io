function playCoinSnd(count) {

    const z = get(zList, i);
    if (z.y < 10) continue;
    if (Math.hypot(z.x - tx, z.y - ty) > maxRange) break;
    if (z.kind > 0) {
      const dmg = Math.min(rem, z.hp); z.hp -= dmg; rem -= dmg; bh = true;
      for (let k = 0; k < 4; k++) { const a = Math.random() * 6.28, s = 2 + Math.random() * 5; bList.push({ x: z.x, y: z.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1.5, c: z.kind === 2 ? '#7dd3fc' : '#fda4af', ttl: 18 }); }
      if (z.hp <= 0) {
        bossKilled = true;
        const pCnt = z.kind === 2 ? 35 : 18;
        for (let k = 0; k < pCnt; k++) { const a = Math.random() * 6.28, s = 3 + Math.random() * 10; bList.push({ x: z.x, y: z.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, c: '#fde047', ttl: 30 }); }
        if (z.kind === 2) { kills += 50; pwr += 4; startFever(6.0, 5, 'SUPER FEVER!! 6秒間無双!!'); shk = 16; }
        else { kills += 15; pwr += 2; startFever(4.0, 3, 'RUBY FEVER!! 4秒間3倍!!'); shk = 10; }
        zList.splice(i, 1); i--;
      }
    } else {
      rem -= 1; kn += z.isGem ? 2 : 1;
      for (let k = 0; k < 2; k++) { const a = Math.random() * 6.28, s = 3 + Math.random() * 6; bList.push({ x: z.x, y: z.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1.5, c: z.isGem ? '#6ee7b7' : '#fde047', ttl: 20 }); }
      zList.splice(i, 1); i--;
    }
  }
  if (kn > 0) {
    playCoinSnd(kn);
  } else if (bh && !bossKilled) {
    playGemHitSnd();
  }
  if (kn > 0 || bh) {
    if (shk < 10) shk = Math.min(10, 3 + Math.floor(getCurPower() / 12));
    kills += kn; kNum.textContent = kills;
    if (kn > 0) tList.push({ x: tx, y: ty - 12, txt: '+' + kn, c: '#fde047', ttl: 22 });
  }
});

function start() {
  initAudio();
  fit(); run = true; pwr = 2; kills = 0; tLeft = 60.0; lastT = performance.now();
  spAcc = 0; midT = 4.5; bigT = 8.0; spdUp = 0; shk = 0; gT = 0; gOn = false; feverTime = 0; feverMult = 1;
  box.className = ''; feverBar.style.display = 'none'; rankBox.style.display = 'none'; shareRow.style.display = 'none';
  affiArea.style.display = 'none';
  logoWrap.style.display = 'none';
  zList = new Array(); bList = new Array(); tList = new Array(); rList = new Array();
  tNum.textContent = '60.0'; kNum.textContent = '0'; pNum.textContent = '2';
  gates.style.display = 'none'; menu.style.display = 'none';
  for (let i = 0; i < 45; i++) addZ(1, 0.95, 50 + Math.random() * 160);
  playCoinSnd(5);
  requestAnimationFrame(tick);
}
function end(why) {
  run = false; gates.style.display = 'none'; feverBar.style.display = 'none'; box.className = ''; menu.style.display = 'flex';
  lastWhy = why;
  mTitle.textContent = why === 'time' ? 'TIME UP!!' : 'GAME OVER...';
  mTitle.style.color = why === 'time' ? '#38bdf8' : '#ef4444';
  const info = getRankInfo(kills);
  lastInfo = info;
  rankChar.textContent = 'RANK ' + info.r;
  rankChar.style.color = info.col;
  rankMsg.textContent = '「' + info.msg + '」';
  rankBox.style.display = 'block';
  shareRow.style.display = 'flex';
  if (kills > bestScore) {
    bestScore = kills;
    try { localStorage.setItem('coin_rush_best', String(bestScore)); } catch (e) {}
  }
  mDesc.innerHTML = (why === 'time' ? '60秒間集めきった！' : '一番下まで溢れてしまった！') + '<br>獲得コイン: <strong>' + kills + '枚</strong>';
  bestTxt.textContent = '自己ベスト: ' + bestScore + '枚';
  sbtn.textContent = 'もう一度挑戦';
  affiArea.style.display = 'block';
}
sbtn.onclick = start;
function tick(now) {
  if (!run) return;
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now; tLeft -= dt;
  const f60 = dt * 60;
  if (tLeft <= 0) { tNum.textContent = '0.0'; end('time'); return; }
  tNum.textContent = tLeft.toFixed(1);
  if (feverTime > 0) {
    feverTime -= dt;
    feverBar.textContent = 'GOLD FEVER!! 残り ' + Math.max(0, feverTime).toFixed(1) + '秒';
    if (feverTime <= 0) { feverTime = 0; feverMult = 1; box.className = ''; feverBar.style.display = 'none'; }
  }
  pNum.textContent = getCurPower();
  const el = 60 - tLeft, diff = 1 + el * 0.06, spd = 0.95 + el * 0.022 + spdUp;
  const feverSpawn = feverTime > 0 ? 2.5 : 1.0;
  spAcc += dt * (13 * diff * feverSpawn);
  if (spAcc >= 1) { const n = Math.floor(spAcc); addZ(n, spd); spAcc -= n; }
  midT += dt; if (midT >= 8.5) { addMidBoss(el); midT = 0; }
  bigT += dt; if (bigT >= 18.0) { addBigBoss(el); bigT = 0; }
  let ox = 0, oy = 0;
  if (shk > 0) { ox = (Math.random() - 0.5) * shk * 2; oy = (Math.random() - 0.5) * shk * 2; shk = Math.max(0, shk - f60); }
  ctx.setTransform(1, 0, 0, 1, ox, oy);
  ctx.fillStyle = feverTime > 0 ? '#2e2618' : '#1e1b4b'; ctx.fillRect(-20, -20, cv.width + 40, cv.height + 40);
  ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(0, cv.height - 3); ctx.lineTo(cv.width, cv.height - 3); ctx.stroke();
  if (!gOn) { gT += f60; if (gT > 200) openG(); } else { gL -= f60; if (gL <= 0) closeG(); }
  for (let i = 0; i < zList.length; i++) {
    const z = get(zList, i); z.y += z.s * f60; z.w += 0.12 * f60;
    const dx = z.x + Math.sin(z.w) * (z.kind > 0 ? 0.6 : 1.2);
    if (z.kind === 2) {
      ctx.fillStyle = 'rgba(56, 189, 248, 0.25)'; ctx.beginPath(); ctx.arc(dx, z.y, z.r + 8 + Math.sin(z.w * 2) * 3, 0, 6.28); ctx.fill();
      drawDiamond(dx, z.y, z.r, '#0284c7', '#e0f2fe', 3);
    } else if (z.kind === 1) {
      drawDiamond(dx, z.y, z.r, '#e11d48', '#ffe4e6', 2);
    } else if (z.isGem) {
      drawDiamond(dx, z.y, z.r, '#10b981', '#a7f3d0', 1.2);
    } else {
      ctx.fillStyle = '#facc15'; ctx.beginPath(); ctx.arc(dx, z.y, z.r, 0, 6.28); ctx.fill();
      ctx.strokeStyle = '#fef08a'; ctx.lineWidth = 1.2; ctx.stroke();
    }
    if (z.kind > 0) {
      const bw = z.kind === 2 ? 56 : 34, bx = dx - bw / 2, by = z.y - z.r - 10;
      ctx.fillStyle = '#000'; ctx.fillRect(bx - 1, by - 1, bw + 2, 7);
      ctx.fillStyle = z.kind === 2 ? '#38bdf8' : '#fb7185'; ctx.fillRect(bx, by, bw * Math.max(0, z.hp / z.max), 5);
      ctx.fillStyle = '#fff'; ctx.font = z.kind === 2 ? 'bold 11px sans-serif' : 'bold 9px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(z.hp, dx, z.y + 4);
    }
    if (z.y + z.r >= cv.height) { end('dead'); return; }
  }
  for (let i = rList.length - 1; i >= 0; i--) {
    const rg = get(rList, i);
    rg.ttl -= f60;
    if (rg.ttl <= 0) { rList.splice(i, 1); continue; }
    const prog = 1 - (rg.ttl / rg.maxTtl);
    const rad = rg.r + (rg.maxR - rg.r) * prog;
    ctx.save();
    ctx.globalAlpha = Math.max(0, 1 - prog) * 0.65;
    ctx.strokeStyle = rg.c;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(rg.x, rg.y, rad, 0, 6.28);
    ctx.stroke();
    ctx.restore();
  }
  for (let i = bList.length - 1; i >= 0; i--) {
    const p = get(bList, i); p.x += p.vx * f60; p.y += p.vy * f60; p.vy += 0.3 * f60; p.ttl -= f60;
    ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, 4, 4);
    if (p.ttl <= 0) bList.splice(i, 1);
  }
  for (let i = tList.length - 1; i >= 0; i--) {
    const f = get(tList, i); f.y -= 1.2 * f60; f.ttl -= f60;
    ctx.font = 'bold 15px sans-serif'; ctx.fillStyle = f.c; ctx.textAlign = 'center'; ctx.fillText(f.txt, f.x, f.y);
    if (f.ttl <= 0) tList.splice(i, 1);
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  requestAnimationFrame(tick);
}
</script>
